name: Release packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish versioned packages after all dry-run checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: Verify the publish ref
        if: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Publishing is only allowed from master (received $GITHUB_REF)." >&2
            exit 1
          fi
      - name: Configure release tag identity
        if: ${{ inputs.publish }}
        run: |
          git config user.name rwcourson
          git config user.email 308136783+rwcourson@users.noreply.github.com
      - name: Publish with provenance
        if: ${{ inputs.publish }}
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - name: Push release tags
        if: ${{ inputs.publish }}
        run: git push --atomic origin HEAD:refs/heads/master --follow-tags
